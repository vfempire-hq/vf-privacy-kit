[package]
name        = "vf-privacy-kit"
description = "Shared crypto + sealed-transport primitives for every VF Empire product. Sealed identity, sealed channel, sealed offline data packs."
version.workspace     = true
edition.workspace     = true
rust-version.workspace = true
license.workspace     = true
authors.workspace     = true
repository.workspace  = true
homepage.workspace    = true
readme.workspace      = true
categories = ["cryptography", "authentication", "network-programming"]
keywords   = ["crypto", "privacy", "age", "ed25519", "sealed"]

[lib]
name = "vf_privacy_kit"
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
x25519-dalek     = { workspace = true }
ed25519-dalek    = { workspace = true }
age              = { workspace = true }
argon2           = { workspace = true }
chacha20poly1305 = { workspace = true }
sha2             = { workspace = true }
hex              = { workspace = true }
blake3           = { workspace = true }
zeroize          = { workspace = true }
rand             = { workspace = true }
subtle           = { workspace = true }
base64           = { workspace = true }
serde            = { workspace = true }
serde_json       = { workspace = true }
anyhow           = { workspace = true }
thiserror        = { workspace = true }
reqwest          = { workspace = true }
tokio            = { workspace = true }
uniffi           = { workspace = true, optional = true }

[features]
default = ["std"]
std     = []
# Enables the uniffi-generated FFI. Turned on by the Swift/Android build.
ffi     = ["uniffi", "std"]

[dev-dependencies]
# Property-based tests + timing regression harness.
proptest = "1.5"
